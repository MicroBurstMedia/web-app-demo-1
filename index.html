<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroBurstMedia | Interlink Simulator</title>
  <style>
    /* 1. GLOBAL CYBER MINIMALISM DESIGN */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #060913;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .app-container {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 24px;
      width: 100%;
      max-width: 600px; /* Scales perfectly for desktop and mobile portrait */
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* 2. HEADER */
    .header-block {
      text-align: center;
    }

    .header-block h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #3b82f6;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    .header-block p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-top: 5px;
    }

    /* 3. VISUAL BACKEND SYSTEM GRID */
    .grid-display-frame {
      position: relative;
      width: 100%;
      height: 320px;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .pipeline-svg {
      width: 100%;
      height: 100%;
    }

    /* The rigid circuit board track */
    .grid-track-bg {
      fill: none;
      stroke: #1e293b;
      stroke-width: 6;
      stroke-linejoin: round;
    }

    .grid-track-active {
      fill: none;
      stroke: #10b981; /* Green to represent currency/data */
      stroke-width: 6;
      stroke-linejoin: round;
      opacity: 0.2;
    }

    /* Nodes */
    .node-hub {
      fill: #0f172a;
      stroke: #334155;
      stroke-width: 4;
      transition: all 0.3s ease;
    }

    .node-hub.active {
      fill: #10b981;
      stroke: #34d399;
      filter: drop-shadow(0 0 10px #10b981);
    }

    .node-label {
      fill: #94a3b8;
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
      pointer-events: none;
    }

    /* The moving currency particle */
    .currency-packet {
      fill: #34d399;
      filter: drop-shadow(0 0 8px #10b981) drop-shadow(0 0 16px #34d399);
      display: none; /* Hidden until triggered */
    }

    /* 4. USER BOARD & ESTIMATOR HUB */
    .user-board {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #060913;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
    }

    .controls-row {
      display: flex;
      gap: 15px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      border: none;
    }

    .btn-run {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }

    .btn-run:active { transform: scale(0.96); }
    .btn-run:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }

    .btn-auto {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .btn-auto.active {
      background: #10b981;
      color: #060913;
      border-color: #34d399;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    /* Estimator Stats */
    .estimator-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .stat-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-box label {
      display: block;
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      outline: none;
      border-bottom: 1px dashed #334155;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: #f3f4f6;
    }

    .stat-income {
      color: #34d399; /* Green for money */
    }

    /* 5. LEARNING MATRIX (TEXT SLIDER) */
    .learning-slider {
      display: flex;
      align-items: stretch;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      min-height: 140px;
    }

    .slider-btn {
      background: #1e293b;
      color: #94a3b8;
      border: none;
      width: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slider-btn:hover { background: #334155; color: #fff; }

    .slider-content {
      flex: 1;
      display: flex;
      padding: 15px;
      gap: 15px;
      align-items: center;
    }

    .slider-image-frame {
      width: 80px;
      height: 80px;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #334155;
    }

    .slider-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slider-text {
      flex: 1;
    }

    .slider-text h3 {
      font-size: 1.1rem;
      color: #60a5fa;
      margin-bottom: 6px;
    }

    .slider-text p {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="header-block">
      <h1>MicroBurstMedia</h1>
      <p>Interactive Interlink Sequence Simulator</p>
    </div>

    <div class="grid-display-frame">
      <svg class="pipeline-svg" viewBox="0 0 400 300">
        <path id="mainTrack" class="grid-track-bg" d="M 50,40 L 350,40 L 350,150 L 50,150 L 50,260 L 200,260" />
        <path class="grid-track-active" d="M 50,40 L 350,40 L 350,150 L 50,150 L 50,260 L 200,260" />

        <circle id="node1" class="node-hub" cx="50" cy="40" r="12" />
        <text x="50" y="20" class="node-label">Traffic Source</text>

        <circle id="node2" class="node-hub" cx="350" cy="40" r="12" />
        <text x="350" y="20" class="node-label">Sales Funnel</text>

        <circle id="node3" class="node-hub" cx="350" cy="150" r="12" />
        <text x="350" y="130" class="node-label">Payment Gateway</text>

        <circle id="node4" class="node-hub" cx="50" cy="150" r="12" />
        <text x="50" y="130" class="node-label">Storage Vault</text>

        <circle id="node5" class="node-hub" cx="200" cy="260" r="16" />
        <text x="200" y="290" class="node-label" style="fill: #10b981;">Business Funded</text>

        <circle id="dataPacket" class="currency-packet" r="6" cx="50" cy="40" />
      </svg>
    </div>

    <div class="user-board">
      <div class="controls-row">
        <button id="runOnceBtn" class="btn btn-run" onclick="triggerRunOnce()">Run AI Once</button>
        <button id="autoToggleBtn" class="btn btn-auto" onclick="toggleAutoMode()">Auto System: OFF</button>
      </div>

      <div class="estimator-grid">
        <div class="stat-box">
          <label>Product Price</label>
          <div style="display:flex; align-items:center; justify-content:center;">
            <span style="color:#fff; font-size:1.2rem; font-weight:bold;">$</span>
            <input type="number" id="priceInput" value="500" oninput="calculateIncome()">
          </div>
        </div>
        <div class="stat-box">
          <label>Sales Number</label>
          <div class="stat-value" id="salesDisplay">0</div>
        </div>
        <div class="stat-box">
          <label>Estimated Income</label>
          <div class="stat-value stat-income" id="incomeDisplay">$0</div>
        </div>
      </div>
    </div>

    <div class="learning-slider">
      <button class="slider-btn" onclick="slide(-1)">&#10094;</button>
      
      <div class="slider-content">
        <div class="slider-image-frame">
          <img id="sliderImg" src="" alt="Learning Context Grid Visual">
        </div>
        <div class="slider-text">
          <h3 id="sliderTitle">Stage 1: Content Matrix Engine</h3>
          <p id="sliderDesc">Captures top-of-funnel inbound visual traffic streams, identifying incoming traffic parameters cleanly.</p>
        </div>
      </div>

      <button class="slider-btn" onclick="slide(1)">&#10095;</button>
    </div>

  </div>

  <script>
    /* --- 1. ESTIMATOR HUB LOGIC --- */
    let salesCount = 0;
    
    function calculateIncome() {
      const price = parseFloat(document.getElementById('priceInput').value) || 0;
      const income = price * salesCount;
      
      // Format with commas
      document.getElementById('salesDisplay').innerText = salesCount.toLocaleString();
      document.getElementById('incomeDisplay').innerText = "$" + income.toLocaleString();
    }

    function incrementSales() {
      salesCount++;
      calculateIncome();
    }


    /* --- 2. GRID ANIMATION ENGINE --- */
    const track = document.getElementById('mainTrack');
    const packet = document.getElementById('dataPacket');
    const runOnceBtn = document.getElementById('runOnceBtn');
    const autoBtn = document.getElementById('autoToggleBtn');
    
    let isAnimating = false;
    let isAutoMode = false;
    
    // Milestones roughly calculated based on the SVG path length
    const nodeMilestones = [
      { id: 1, trigger: 0.0 },   // Traffic
      { id: 2, trigger: 0.35 },  // Triage
      { id: 3, trigger: 0.48 },  // Stripe
      { id: 4, trigger: 0.83 },  // Dropbox
      { id: 5, trigger: 1.0 }    // Funded
    ];

    function clearNodes() {
      for(let i=1; i<=5; i++) {
        document.getElementById(`node${i}`).classList.remove('active');
      }
    }

    function toggleAutoMode() {
      isAutoMode = !isAutoMode;
      if(isAutoMode) {
        autoBtn.classList.add('active');
        autoBtn.innerText = "Auto System: ON";
        if(!isAnimating) animatePipeline();
      } else {
        autoBtn.classList.remove('active');
        autoBtn.innerText = "Auto System: OFF";
      }
    }

    function triggerRunOnce() {
      if(isAnimating) return;
      isAutoMode = false; // Disable auto if they manually click run once
      autoBtn.classList.remove('active');
      autoBtn.innerText = "Auto System: OFF";
      animatePipeline();
    }

    function animatePipeline() {
      isAnimating = true;
      runOnceBtn.disabled = true;
      packet.style.display = "block";
      clearNodes();

      const trackLength = track.getTotalLength();
      let startTime = null;
      const duration = 2500; // 2.5 seconds to cross the whole grid
      let currentNodeIndex = 0;

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = Math.min((timestamp - startTime) / duration, 1);

        // Get exact X/Y on the path
        let currentLength = progress * trackLength;
        let point = track.getPointAtLength(currentLength);

        packet.setAttribute('cx', point.x);
        packet.setAttribute('cy', point.y);

        // Check node collisions
        if (currentNodeIndex < nodeMilestones.length) {
          if (progress >= nodeMilestones[currentNodeIndex].trigger) {
            let nId = nodeMilestones[currentNodeIndex].id;
            document.getElementById(`node${nId}`).classList.add('active');
            
            // NOTE: Automatic adjustment of 'currentSlide' has been completely decoupled here
            // so the text slider remains purely under manual customer control while system loops.

            currentNodeIndex++;
          }
        }

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          // Animation Complete
          incrementSales(); // Add money!
          packet.style.display = "none";
          
          setTimeout(() => {
            clearNodes();
            isAnimating = false;
            runOnceBtn.disabled = false;
            
            // Loop if Auto is ON
            if(isAutoMode) {
              animatePipeline();
            }
          }, 400); // Short pause before resetting
        }
      }

      requestAnimationFrame(step);
    }


    /* --- 3. LEARNING MATRIX SLIDER LOGIC --- */
    const curriculum = [
      {
        title: "Stage 1: Traffic Source",
        desc: "Market visitors to your link in bio through generating traffic streams from one or more social paltforms, to build brand awareness.",
        img: "https://www.tbhcreative.com/wp-content/uploads/repeat-website-visitors.png" // Replace with real asset URLs as needed
      },
      {
        title: "Stage 2: Sales Funnel",
        desc: "Welcome visitors to a professional landing page where this turns your viewers into consumers based on what your offering and your setup.",
        img: "https://www.salesforce.com/au/blog/wp-content/uploads/sites/4/2023/06/sales-funnel-main-image.png"
      },
      {
        title: "Stage 3: Payment Gateway",
        desc: "Intergrate a POS system to get alerted about online transactions that are processed by triggers via payment links automatically.",
        img: "https://ai.paytabs.com/wp-content/uploads/2018/02/blog-image1.jpg"
      },
      {
        title: "Stage 4: Storage Vault",
        desc: "Complete fulfillments by dynamically giving users instant online access to digital products and or scheduling service platforms after payment.",
        img: "https://www.k2view.com/hubfs/27bblog-1.jpg"
      },
      {
        title: "Stage 5: Business Funded",
        desc: "Digital currency is safely deposited into your business bank account, building a papertrail as more sales are generated and processed.",
        img: "https://noobpreneur.com/wp-content/uploads/2016/06/small-business-funding.jpg"
      }
    ];

    let currentSlide = 0;

    function slide(direction) {
      currentSlide += direction;
      
      // Loop around
      if (currentSlide < 0) currentSlide = curriculum.length - 1;
      if (currentSlide >= curriculum.length) currentSlide = 0;

      updateSliderUI();
    }

    function updateSliderUI() {
      const data = curriculum[currentSlide];
      document.getElementById('sliderTitle').innerText = data.title;
      document.getElementById('sliderDesc').innerText = data.desc;
      
      // Pass the standard direct source attribute cleanly
      document.getElementById('sliderImg').src = data.img;
    }

    // Initialize values on load
    calculateIncome();
    updateSliderUI();

  </script>
</body>
</html>
