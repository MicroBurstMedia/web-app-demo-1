<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroBurstMedia Interlink Engine</title>
  <style>
    /* 1. GLOBAL DESIGN SYSTEM (CYBER MINIMALISM) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #060913;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      overflow-y: auto; /* Ensures full web desktop scrollability */
    }

    /* Container matching your structured workflow card styling */
    .interlink-runtime-card {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 28px;
      width: 100%;
      max-width: 580px; /* Perfect desktop centering; scales natively down to mobile */
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .header-block {
      text-align: center;
    }

    .header-block h2 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .header-block p {
      font-size: 1rem;
      color: #64748b;
      margin-top: 6px;
    }

    /* 2. THE SNAKE MOTION PIPELINE LINK GRAPH */
    .pipeline-view-frame {
      position: relative;
      width: 100%;
      height: 240px;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* SVG Track matching the precise fluid curves seen in your video */
    .pipeline-svg-track {
      width: 85%;
      height: 80%;
    }

    .track-path-underlay {
      fill: none;
      stroke: #1e293b;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .track-path-pulse {
      fill: none;
      stroke: #2563eb;
      stroke-width: 8;
      stroke-linecap: round;
      opacity: 0.3;
    }

    /* Interactive Node Coordinates */
    .network-hub-dot {
      fill: #0f172a;
      stroke: #334155;
      stroke-width: 4;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .network-hub-dot.active-node {
      fill: #2563eb;
      stroke: #60a5fa;
      stroke-width: 6;
      filter: drop-shadow(0 0 12px #2563eb);
    }

    /* Moving Processing Core Packet */
    .conveyor-data-packet {
      fill: #60a5fa;
      filter: drop-shadow(0 0 10px #3b82f6) drop-shadow(0 0 20px #2563eb);
    }

    /* 3. DYNAMIC STEP DETAILS BLOCK */
    .summary-details-deck {
      background: #060913;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.3s ease;
    }

    .summary-details-deck.pulse-border {
      border-color: #2563eb;
    }

    .step-badge {
      display: inline-block;
      align-self: flex-start;
      background: rgba(37, 99, 235, 0.1);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .summary-details-deck h3 {
      font-size: 1.3rem;
      color: #ffffff;
      font-weight: 600;
    }

    .summary-details-deck p {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.6;
    }

    /* 4. DRIVER CONTROL INTERFACE */
    .action-control-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .engine-trigger-btn {
      width: 100%;
      height: 60px;
      background: #ffffff;
      color: #060913;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .engine-trigger-btn:hover {
      background: #e2e8f0;
    }

    .engine-trigger-btn:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="interlink-runtime-card">
    
    <div class="header-block">
      <h2>Interlink System</h2>
      <p>Automated Network Node Pipeline</p>
    </div>

    <div class="pipeline-view-frame">
      <svg class="pipeline-svg-track" viewBox="0 0 400 200">
        <path id="pipelineTrack" class="track-path-underlay" d="M 30,50 C 150,50 100,100 200,100 C 300,100 250,150 370,150" />
        <path class="track-path-pulse" d="M 30,50 C 150,50 100,100 200,100 C 300,100 250,150 370,150" />

        <circle id="nodeMarker1" class="network-hub-dot" cx="30" cy="50" r="10" />
        <circle id="nodeMarker2" class="network-hub-dot" cx="130" cy="72" r="10" />
        <circle id="nodeMarker3" class="network-hub-dot" cx="260" cy="122" r="10" />
        <circle id="nodeMarker4" class="network-hub-dot" cx="370" cy="150" r="10" />

        <circle id="motionPacket" class="conveyor-data-packet" r="8" cx="30" cy="50" style="display: none;" />
      </svg>
    </div>

    <div class="summary-details-deck" id="detailsDeck">
      <div class="step-badge" id="stepBadge">Status</div>
      <h3 id="stepTitle">Pipeline Ready</h3>
      <p id="stepDesc">Initialize the conveyor sequence execution path below to track incoming payload distributions moving natively between live operational nodes.</p>
    </div>

    <div class="action-control-panel">
      <button class="engine-trigger-btn" id="triggerBtn" onclick="runPipelineSequence()">Execute Link Cycle</button>
    </div>

  </div>

  <script>
    const pipelineSteps = [
      { badge: "Stage 01", title: "Content Matrix", desc: "Captures top-of-funnel inbound visual traffic streams, identifying incoming traffic parameters cleanly.", progressEnd: 0.0 },
      { badge: "Stage 02", title: "Triage Registry", desc: "Sifts parameters instantly to isolate clean transactional indicators from cold user entries.", progressEnd: 0.33 },
      { badge: "Stage 03", title: "Stripe Gateway", desc: "Fires direct transaction processing triggers via touchless background webhooks automatically.", progressEnd: 0.72 },
      { badge: "Stage 04", title: "Dropbox Delivery", desc: "Completes fulfillment by dynamically packing assets and instantly generating access points.", progressEnd: 1.0 }
    ];

    function runPipelineSequence() {
      const track = document.getElementById('pipelineTrack');
      const packet = document.getElementById('motionPacket');
      const button = document.getElementById('triggerBtn');
      const deck = document.getElementById('detailsDeck');
      
      button.disabled = true;
      packet.style.display = "block";
      
      const trackLength = track.getTotalLength();
      let currentStageIndex = 0;
      let animationStartTime = null;
      const totalDuration = 6000; // 6 seconds clean step crawl traversal

      // Reset node highlights immediately upon trigger
      clearNodeHighlights();

      function updateMotion(timestamp) {
        if (!animationStartTime) animationStartTime = timestamp;
        let elapsed = timestamp - animationStartTime;
        let progress = Math.min(elapsed / totalDuration, 1);

        // Calculate exact path plot position coordinates coordinates
        let currentLength = progress * trackLength;
        let currentPoint = track.getPointAtLength(currentLength);

        packet.setAttribute('cx', currentPoint.x);
        packet.setAttribute('cy', currentPoint.y);

        // Check if packet passed or hit next stage milestone threshold
        if (currentStageIndex < pipelineSteps.length) {
          let targetMilestone = pipelineSteps[currentStageIndex].progressEnd;
          if (progress >= targetMilestone) {
            highlightNode(currentStageIndex + 1);
            updateContentCard(pipelineSteps[currentStageIndex]);
            
            deck.classList.add('pulse-border');
            setTimeout(() => deck.classList.remove('pulse-border'), 400);
            
            currentStageIndex++;
          }
        }

        if (progress < 1) {
          requestAnimationFrame(updateMotion);
        } else {
          // Cycle finished sequence cleanly
          setTimeout(() => {
            packet.style.display = "none";
            button.disabled = false;
            resetToStandby();
          }, 1200);
        }
      }

      requestAnimationFrame(updateMotion);
    }

    function highlightNode(nodeId) {
      clearNodeHighlights();
      const node = document.getElementById(`nodeMarker${nodeId}`);
      if (node) node.classList.add('active-node');
    }

    function clearNodeHighlights() {
      for (let i = 1; i <= 4; i++) {
        const node = document.getElementById(`nodeMarker${i}`);
        if (node) node.classList.remove('active-node');
      }
    }

    function updateContentCard(stepData) {
      document.getElementById('stepBadge').innerText = stepData.badge;
      document.getElementById('stepTitle').innerText = stepData.title;
      document.getElementById('stepDesc').innerText = stepData.desc;
    }

    function resetToStandby() {
      clearNodeHighlights();
      document.getElementById('stepBadge').innerText = "Status";
      document.getElementById('stepTitle').innerText = "Cycle Complete";
      document.getElementById('stepDesc').innerText = "Pipeline data loop successfully finalized. System standing by for subsequent link cycles.";
    }
  </script>
</body>
</html>
